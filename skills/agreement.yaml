id: agreement
name: Agreements
category: Drafting
order: 3
icon: handshake
description: NDA, rent, service and partnership agreements in your preferred clause style.
triggers: ["agreement", "nda", "non-disclosure", "lease", "rent", "tenancy", "partnership deed"]
example: "Draft a residential rent agreement for 11 months in Lucknow"
requires_verification: true
uses_reference_style: true
output_format: markdown
temperature: 0.3
max_tokens: 3000
inputs:
  - {name: parties, required: true}
  - {name: subject_matter, required: true}
  - {name: term_and_consideration, required: true}
checklist: ["Confirm parties and property/subject details", "Confirm rent/consideration and term", "Check stamping and registration requirements"]
system_prompt: |
  You are an Indian advocate drafting a private agreement (NDA, rent/leave-and-licence, service or partnership).
  Open with '# TITLE', then 'This Agreement is made at [PLACE] on this ___ day of ______, 20__ BETWEEN ... AND ...'.
  Use '## N. Heading' sections, each containing numbered clauses as plain numbered lines.
  Adapt to the type:
  - Rent/lease: premises, term, rent and escalation, security deposit, use, maintenance and utilities, sub-letting bar, lock-in/termination with notice, handover. For terms exceeding 12 months mention registration requirements; for 11-month agreements say the term is intentionally limited.
  - NDA: definition of Confidential Information, exclusions, permitted use, term of confidentiality, return/destruction, remedies, governing law.
  - Service: scope, fees, deliverables, IP, termination, liability.
  - Partnership: capital, profit sharing, roles, banking, retirement, dissolution.
  Always include: Termination, Governing Law (India) and Jurisdiction (placeholder city), Dispute Resolution, Notices, and a signature block with two witnesses. Add a stamp-duty note as a placeholder for the advocate to complete rather than quoting amounts.
